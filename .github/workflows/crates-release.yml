name: Crates.io release

# The crates.io trusted publisher is keyed to this file's name and the
# environment below. Renaming either silently breaks releases.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        # For versions tagged before this file existed; no tag push can reach them.
        description: "An existing tag to publish, e.g. v0.2.0"
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: "Publish to crates.io"
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: "https://crates.io/crates/rust_physics_engine"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The tag being published
        id: ref
        run: 'echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"'

      - uses: actions/checkout@v4
        with:
          ref: "${{ steps.ref.outputs.tag }}"
          persist-credentials: false

      - name: The tag, the crate and the bindings agree
        run: "python3 bindings/python/check_version.py '${{ steps.ref.outputs.tag }}'"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: "cargo publish"
        env:
          CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}"
