[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "numeria"
description = "Physics, mathematics and engineering computation: 4,000+ validated functions across 71 domains, in Rust, callable from Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Magic-Man", email = "mimsec-contact@mimsec.com" }]
keywords = ["physics", "mathematics", "simulation", "science", "engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Magic-Man-us/RustPhysicsEngine"
Source = "https://github.com/Magic-Man-us/RustPhysicsEngine"
Documentation = "https://github.com/Magic-Man-us/RustPhysicsEngine/blob/main/bindings/python/README.md"
Issues = "https://github.com/Magic-Man-us/RustPhysicsEngine/issues"
Changelog = "https://github.com/Magic-Man-us/RustPhysicsEngine/releases"

[tool.maturin]
# A mixed layout: the compiled `_core` extension lands inside the pure
# Python package, which owns `__init__.py` and the `.pyi` stubs.
python-source = "python"
module-name = "numeria._core"
features = ["pyo3/extension-module"]
include = ["python/numeria/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
